name: Build Android U-Boot

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Arsitektur (arm, arm64, x86)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm
          - arm64
          - x86
          - bsp
      board_name:
        description: 'Board Name or Defconfig (eg: sp9863a_1h10)'
        required: false
        type: string
      device_tree:
        description: 'Device Tree (opsional)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex bc git wget gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu

      - name: Setup Toolchain Path Symlink
        run: |
          TARGET_DIR="../prebuilts/gcc/linaro-x86/aarch64/gcc-linaro-4.8-2015.06-x86_64_aarch64-linux-gnu/bin"
          mkdir -p "$TARGET_DIR"
          
          ln -s /usr/bin/aarch64-linux-gnu-gcc-9 "$TARGET_DIR/aarch64-linux-gnu-gcc"
          ln -s /usr/bin/aarch64-linux-gnu-ld-9 "$TARGET_DIR/aarch64-linux-gnu-ld"
          ln -s /usr/bin/aarch64-linux-gnu-as-9 "$TARGET_DIR/aarch64-linux-gnu-as"
          ln -s /usr/bin/aarch64-linux-gnu-objcopy-9 "$TARGET_DIR/aarch64-linux-gnu-objcopy"
          ln -s /usr/bin/aarch64-linux-gnu-cpp-9 "$TARGET_DIR/aarch64-linux-gnu-cpp"

      - name: Make Executable
        run: chmod +x make.sh

      - name: Run Build Script
        run: |
          if [ "${{ github.event.inputs.arch }}" = "bsp" ]; then
            bash ./make.sh bsp
          else
            bash ./make.sh ${{ github.event.inputs.arch }} ${{ github.event.inputs.board_name }} ${{ github.event.inputs.device_tree }}
          fi

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-output-${{ github.event.inputs.board_name }}
          path: |
            out/
            *.bin
            *.img
